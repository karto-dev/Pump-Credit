# Fixed project name so the database volume (petrolpumpcredit_ppcms-pgdata) is the same whatever the folder is called.
name: petrolpumpcredit

services:
  postgres:
    image: postgres:16
    container_name: ppcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petrol_credit
      POSTGRES_USER: ppcms
      POSTGRES_PASSWORD: ppcms_local_dev
    ports:
      - "5434:5432"   # 5432/5433 are already used by other local containers
    volumes:
      - ppcms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppcms -d petrol_credit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ppcms-pgdata:
